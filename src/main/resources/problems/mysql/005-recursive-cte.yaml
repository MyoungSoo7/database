id: "mysql-005"
title: "재귀 CTE — 부서 계층 전체 조회"
category: "mysql"
difficulty: 3
description: |
  `departments` 테이블은 *자기 참조 (parent_id)* 로 부서 계층을 표현합니다.
  *기술본부 (id=2)* 의 *자기 자신 + 모든 하위 부서* 를 보여주세요.
  결과 컬럼은 `id`, `name`, `depth` 세 개입니다. `depth` 는 *기술본부 기준 0* 부터 시작.

  **MySQL 8.0 / MariaDB 10.2.2+ 의 재귀 CTE**:
  ```
  WITH RECURSIVE 별칭 AS (
    -- 시작점 (anchor)
    SELECT ... FROM ... WHERE 시작조건
    UNION ALL
    -- 재귀 단계 — 별칭 을 자기 자신으로 참조
    SELECT ... FROM ... JOIN 별칭 ON ...
  )
  SELECT * FROM 별칭;
  ```

  이 패턴은 *조직도 / 카테고리 트리 / 댓글 스레드 / 게시판 답글* 같은 *계층 데이터* 에 표준.
  MySQL 8.0 미만 / MariaDB 10.2.2 미만 에서는 재귀 CTE 불가 → *반복 self-join* 또는 *경로 컬럼* 으로 우회.

  결과는 *depth 오름차순*. 같은 depth 면 *id 오름차순*.
type: SELECT
schema: "005-schema.sql"
expected:
  columns: ["id", "name", "depth"]
  rows:
    - [2, "기술본부",     0]
    - [4, "백엔드팀",     1]
    - [5, "프론트엔드팀", 1]
    - [7, "API 그룹",     2]
    - [8, "플랫폼 그룹",  2]
  orderMatters: true
hint: "WITH RECURSIVE sub AS (SELECT id, name, 0 AS depth FROM departments WHERE id = 2 UNION ALL SELECT d.id, d.name, s.depth + 1 FROM departments d JOIN sub s ON d.parent_id = s.id) SELECT * FROM sub ORDER BY depth, id"
# 정답 예시 — 화면엔 안 나오고 오늘의 문제 풀이와 검증 테스트에 쓴다.
solution: |
  WITH RECURSIVE sub AS (
      SELECT id, name, 0 AS depth FROM departments WHERE id = 2
      UNION ALL
      SELECT d.id, d.name, s.depth + 1 FROM departments d JOIN sub s ON d.parent_id = s.id
  )
  SELECT id, name, depth FROM sub ORDER BY depth, id
