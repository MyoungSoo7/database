id: "mysql-002"
title: "DATE_FORMAT — 주문일을 'YYYY년 MM월' 로 출력"
category: "mysql"
difficulty: 1
description: |
  `orders` 테이블의 모든 주문에 대해 *고객명* 과 *주문일* 을 `'2026년 01월'` 형식으로 보여주세요.
  결과 컬럼은 `customer`, `month` 두 개입니다.

  **MySQL/MariaDB 핵심 함수**: `DATE_FORMAT(date, '포맷')`.
  포맷 토큰: `%Y` 4자리 연도, `%m` 2자리 월, `%d` 2자리 일.
  PostgreSQL 의 `TO_CHAR(date, 'YYYY년 MM월')` 와 같은 역할.

  주의: PostgreSQL 의 `TO_CHAR` 와 MySQL 의 `DATE_FORMAT` 은 *포맷 토큰 문법이 완전히 다르다*.
  MySQL 은 `%Y/%m/%d`, PostgreSQL 은 `YYYY/MM/DD`.
type: SELECT
schema: "002-schema.sql"
expected:
  columns: ["customer", "month"]
  rows:
    - ["김철수", "2026년 01월"]
    - ["이영희", "2026년 02월"]
    - ["박민수", "2026년 02월"]
    - ["정수연", "2026년 03월"]
    - ["최지훈", "2026년 03월"]
  orderMatters: false
hint: "DATE_FORMAT(ordered_at, '%Y년 %m월') AS month"
# 정답 예시 — 화면엔 안 나오고 오늘의 문제 풀이와 검증 테스트에 쓴다.
solution: |
  SELECT customer, DATE_FORMAT(ordered_at, '%Y년 %m월') AS month FROM orders
