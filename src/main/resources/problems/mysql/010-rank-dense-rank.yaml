id: "mysql-010"
title: "RANK vs DENSE_RANK — 동률이 있을 때 차이 비교"
category: "mysql"
difficulty: 2
description: |
  `students` 의 각 학생에 대해 *반(class) 내 점수 순위* 를 `RANK` 와 `DENSE_RANK` 두 방식으로 *함께* 보여주세요.
  결과 컬럼: `class_name`, `name`, `score`, `rk`, `dense_rk`. *class_name → score DESC → id ASC* 순.

  **윈도우 함수의 순위 함수 3 종**:
  | 함수 | 동률 처리 | 다음 등수 |
  |---|---|---|
  | `ROW_NUMBER` | *고유* 순위 (1, 2, 3, ...) | 항상 +1 |
  | `RANK` | *같은 순위* | *건너뜀* (1, 1, 3, 4, ...) |
  | `DENSE_RANK` | *같은 순위* | *연속* (1, 1, 2, 3, ...) |

  **실무 선택 기준**:
  - "상위 3명" → ROW_NUMBER (정확히 3명)
  - "1등은 모두 1등" + "그 다음 등수가 의미 있는 경우" → RANK (올림픽 메달)
  - "구간만 의미" → DENSE_RANK (등급 산정)

  이 문제는 *A반에 95점 2명, B반에 91점 2명* 의 동률을 *RANK / DENSE_RANK 차이로* 드러내도록 설계.
type: SELECT
schema: "010-schema.sql"
expected:
  columns: ["class_name", "name", "score", "rk", "dense_rk"]
  rows:
    - ["A", "김철수", 95, 1, 1]
    - ["A", "이영희", 95, 1, 1]
    - ["A", "박민수", 88, 3, 2]
    - ["A", "정수연", 82, 4, 3]
    - ["B", "최지훈", 91, 1, 1]
    - ["B", "한지원", 91, 1, 1]
    - ["B", "강민호", 85, 3, 2]
    - ["B", "오세나", 70, 4, 3]
  orderMatters: true
hint: "SELECT class_name, name, score, RANK() OVER (PARTITION BY class_name ORDER BY score DESC) AS rk, DENSE_RANK() OVER (PARTITION BY class_name ORDER BY score DESC) AS dense_rk FROM students ORDER BY class_name, score DESC, id"
