id: "tuning-005"
title: "컬럼을 함수로 감싸면 인덱스를 못 탄다"
category: "tuning"
difficulty: 2
description: |
  `orders` 에는 `idx_orders_created (created_at)` 가 있습니다. 그런데 대상 쿼리는
  `DATE(created_at) = '2026-03-15'` 처럼 **컬럼을 함수로 감싸서** 인덱스를 못 쓰고 풀스캔합니다.
  인덱스에 정렬돼 있는 건 `created_at` 값이지 `DATE(created_at)` 값이 아니기 때문입니다.

  이번엔 인덱스를 만들지 말고 **쿼리를 고쳐서** 제출하세요. 같은 결과를 내야 합니다.
  컬럼은 그대로 두고 비교 값 쪽을 범위로 바꾸는 게 요령입니다.

  같은 함정: `YEAR(col) = 2026`, `col + 1 = 10`, `SUBSTR(col, 1, 4) = '2026'`, `LOWER(email) = ...`

  참고: MySQL 8.0.13+ 는 함수 기반 인덱스 `CREATE INDEX ... ((DATE(created_at)))` 도 됩니다.
  하지만 쿼리를 바꿀 수 있다면 범위 조건이 더 단순하고 기존 인덱스를 그대로 씁니다.

  채점 기준: 결과 일치, idx_orders_created 사용, 풀스캔·인덱스 풀스캔 금지, 예상 rows 500 이하.
type: TUNING
schema: "005-schema.sql"
target: "SELECT COUNT(*) AS cnt, SUM(amount) AS total FROM orders WHERE DATE(created_at) = '2026-03-15'"
tuning:
  mode: REWRITE
  table: orders
  maxRows: 500
  forbid: [FULL_SCAN, FULL_INDEX_SCAN]
  requireKey: idx_orders_created
expected:
  columns: ["cnt", "total"]
  rows:
    - [164, 8166100]
  orderMatters: false
hint: "WHERE created_at >= '2026-03-15' AND created_at < '2026-03-16' — BETWEEN 으로 23:59:59 를 쓰면 소수 초가 있을 때 빠진다"
solution: "SELECT COUNT(*) AS cnt, SUM(amount) AS total FROM orders WHERE created_at >= '2026-03-15' AND created_at < '2026-03-16'"
