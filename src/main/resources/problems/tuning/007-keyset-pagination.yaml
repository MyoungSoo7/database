id: "tuning-007"
title: "깊은 페이지 — OFFSET 대신 키셋(seek) 페이징"
category: "tuning"
difficulty: 3
description: |
  결제 완료(`PAID`) 주문을 **최신순(`id` 내림차순)으로 10건씩** 보여주는 목록이 있습니다.
  `orders` 에는 `idx_orders_status (status)` 가 있고, 결제 완료 주문은 25,500 건입니다.

  대상 쿼리는 2,549 페이지(끝에서 두 번째 페이지)를 `LIMIT 25480, 10` 으로 가져옵니다.
  `OFFSET` 은 건너뛸 25,480 행을 **실제로 다 읽고 버린 뒤에야** 10 건을 돌려줍니다. 페이지가 깊어질수록 느려집니다.

  사용자는 바로 앞 페이지(2,548 페이지)를 보고 "다음" 을 눌렀고, 그 페이지의 **마지막 주문 `id` 는 26** 이었습니다.
  이 값을 이용해 **건너뛰지 않고 그 다음부터 바로 읽는 쿼리(키셋 페이징)** 로 고쳐 제출하세요.
  결과(컬럼·행·순서)는 대상 쿼리와 같아야 합니다.

  - 정렬 키가 유일해야(여기선 PK `id`) "어디서부터" 가 한 점으로 정해집니다.
  - `EXPLAIN` 의 `rows` 는 `LIMIT` 을 반영하지 않습니다. 읽을 범위 자체를 조건으로 좁혀야 줄어듭니다.

  채점 기준: 결과 일치, 풀스캔·인덱스 풀스캔 금지, 예상 rows 50 이하.
type: TUNING
schema: "007-schema.sql"
target: "SELECT id, customer_id, amount FROM orders WHERE status = 'PAID' ORDER BY id DESC LIMIT 25480, 10"
tuning:
  mode: REWRITE
  table: orders
  maxRows: 50
  forbid: [FULL_SCAN, FULL_INDEX_SCAN]
expected:
  columns: ["id", "customer_id", "amount"]
  rows:
    - [25, 1976, 93500]
    - [24, 57, 89800]
    - [23, 138, 86100]
    - [19, 462, 71300]
    - [18, 543, 67600]
    - [17, 624, 63900]
    - [16, 705, 60200]
    - [15, 786, 56500]
    - [14, 867, 52800]
    - [13, 948, 49100]
  orderMatters: true
hint: "OFFSET 을 없애고 '앞 페이지 마지막 id 보다 작은 것' 을 WHERE 에 넣으세요: WHERE status = 'PAID' AND id < 26 ORDER BY id DESC LIMIT 10"
solution: "SELECT id, customer_id, amount FROM orders WHERE status = 'PAID' AND id < 26 ORDER BY id DESC LIMIT 10"
