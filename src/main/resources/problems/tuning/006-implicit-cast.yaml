id: "tuning-006"
title: "암묵적 형변환 — 따옴표 하나 차이"
category: "tuning"
difficulty: 2
description: |
  `order_no` 는 `VARCHAR(20)` 이고 `idx_orders_order_no` 인덱스도 있습니다.
  그런데 대상 쿼리는 주문번호 한 건을 찾으면서 30,000 행을 풀스캔합니다.

  이유: 문자열 컬럼을 **숫자와 비교하면** MySQL 은 모든 행의 `order_no` 를 숫자로 바꿔서 비교합니다.
  `'2026012345'`, `'02026012345'`, `'2026012345abc'` 가 모두 숫자 2026012345 와 같다고 보기 때문에
  문자열 정렬 순서로 된 인덱스로는 후보를 좁힐 수 없습니다. 컬럼을 함수로 감싼 것과 같은 효과입니다.

  **쿼리를 고쳐서** 인덱스를 타게 하세요. 결과는 같아야 합니다.

  실무에서는 ORM 이나 JDBC 파라미터 타입이 컬럼 타입과 달라서 생기는 경우가 많습니다
  (전화번호·주문번호·우편번호처럼 "숫자처럼 생긴 문자열").
  반대 방향(숫자 컬럼 = '문자열')은 비교 값만 숫자로 바뀌어서 인덱스를 탑니다.

  채점 기준: 결과 일치, idx_orders_order_no 사용, 풀스캔 금지, 예상 rows 10 이하.
type: TUNING
schema: "006-schema.sql"
target: "SELECT id, customer_id, amount FROM orders WHERE order_no = 2026012345"
tuning:
  mode: REWRITE
  table: orders
  maxRows: 10
  forbid: [FULL_SCAN]
  requireKey: idx_orders_order_no
expected:
  columns: ["id", "customer_id", "amount"]
  rows:
    - [12345, 56, 91500]
  orderMatters: false
hint: "비교 값을 컬럼 타입(문자열)에 맞추세요: WHERE order_no = '2026012345'"
solution: "SELECT id, customer_id, amount FROM orders WHERE order_no = '2026012345'"
