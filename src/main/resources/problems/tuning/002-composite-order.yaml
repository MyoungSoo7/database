id: "tuning-002"
title: "복합 인덱스 — 컬럼 순서가 성능을 가른다"
category: "tuning"
difficulty: 2
description: |
  `orders` 에는 이미 `idx_orders_status (status)` 가 있습니다.
  그런데 `status = 'CANCELLED'` 는 1,500 건이나 돼서, 대상 쿼리는 그 1,500 건을 다 읽은 뒤
  날짜로 다시 거릅니다 (실제 답은 55 건).

  **복합 인덱스를 만들어** 예상 rows 를 200 이하로 줄이세요.

  같은 두 컬럼이라도 순서에 따라 결과가 크게 다릅니다. 둘 다 `EXPLAIN` 으로 확인해 보세요.
  - `(created_at, status)` — 범위 조건 컬럼이 앞이라 7일치 약 1,150 행을 훑는다
  - `(status, created_at)` — 등호 컬럼으로 먼저 좁힌 뒤 그 안에서 날짜 범위만 읽는다

  원칙: **등호(=) 조건 컬럼을 앞에, 범위 조건(>, <, BETWEEN) 컬럼을 뒤에.**
  B-Tree 에서 범위 조건 뒤에 오는 컬럼은 탐색 범위를 좁히는 데 쓰이지 못합니다.

  채점 기준: 풀스캔 금지, 예상 rows 200 이하.
type: TUNING
schema: "002-schema.sql"
target: "SELECT COUNT(*) AS cnt FROM orders WHERE status = 'CANCELLED' AND created_at >= '2026-03-01' AND created_at < '2026-03-08'"
tuning:
  mode: INDEX
  table: orders
  maxRows: 200
  forbid: [FULL_SCAN]
expected:
  columns: ["cnt"]
  rows:
    - [55]
  orderMatters: false
hint: "등호 컬럼 → 범위 컬럼 순서. CREATE INDEX idx_orders_status_created ON orders (status, created_at)"
solution: "CREATE INDEX idx_orders_status_created ON orders (status, created_at)"
