id: "ddl-009"
title: "저장형 생성 컬럼 + 인덱스 — 계산값으로 검색하기"
category: "ddl"
difficulty: 3
description: |
  `invoice_lines` 는 청구서 품목(`unit_price` 단가, `qty` 수량)입니다. "금액(단가 × 수량)이 10만 원 이상인 품목" 처럼
  **계산값으로 검색·정렬하는 화면**이 자주 쓰이는데, `WHERE unit_price * qty >= 100000` 은 인덱스를 탈 수 없습니다.

  `invoice_lines` 에 금액 컬럼 `line_total` 을 **생성 컬럼(generated column)** 으로 추가하고, 그 컬럼에 **인덱스**를 만드세요.

  - `line_total` 의 값은 항상 `unit_price * qty` 여야 합니다 (행을 넣거나 고치면 DB 가 자동으로 계산).
  - 계산값을 디스크에 **저장하는(STORED)** 생성 컬럼으로 만듭니다. 타입은 `INT` 또는 `BIGINT`.
  - 인덱스는 `line_total` 이 **첫 번째 컬럼**이면 됩니다. 인덱스 이름은 자유입니다.
  - 다른 컬럼은 그대로 두어야 합니다.

  제출은 SQL **한 문장**입니다. `ALTER TABLE` 한 문장에 쉼표로 여러 변경(`ADD COLUMN ..., ADD INDEX ...`)을 이어 쓸 수 있습니다.
  채점은 초기 스키마에 제출한 문장을 실행한 뒤 `information_schema` 로 구조를 확인합니다.
type: DDL
schema: "adv-schema.sql"
validation:
  type: QUERY
  checkPerProfile:
    mysql: "SELECT CASE WHEN EXISTS (SELECT 1 FROM information_schema.COLUMNS c WHERE c.TABLE_SCHEMA = DATABASE() AND c.TABLE_NAME = 'invoice_lines' AND c.COLUMN_NAME = 'line_total' AND c.EXTRA LIKE 'STORED GENERATED%' AND c.DATA_TYPE IN ('int', 'bigint') AND REPLACE(REPLACE(REPLACE(REPLACE(LOWER(c.GENERATION_EXPRESSION), '`', ''), '(', ''), ')', ''), ' ', '') IN ('unit_price*qty', 'qty*unit_price')) AND EXISTS (SELECT 1 FROM information_schema.STATISTICS s WHERE s.TABLE_SCHEMA = DATABASE() AND s.TABLE_NAME = 'invoice_lines' AND s.COLUMN_NAME = 'line_total' AND s.SEQ_IN_INDEX = 1) AND (SELECT COUNT(*) FROM information_schema.COLUMNS c2 WHERE c2.TABLE_SCHEMA = DATABASE() AND c2.TABLE_NAME = 'invoice_lines') = 6 THEN 1 ELSE 0 END"
  expectedValue: 1
hint: "ALTER TABLE t ADD COLUMN 컬럼 타입 GENERATED ALWAYS AS (식) STORED, ADD INDEX 이름 (컬럼). STORED 를 빼면 기본값은 VIRTUAL(읽을 때마다 계산)입니다."
# 정답 예시 — 화면엔 안 나오고 오늘의 문제 풀이와 검증 테스트에 쓴다.
solution: |
  ALTER TABLE invoice_lines ADD COLUMN line_total INT GENERATED ALWAYS AS (unit_price * qty) STORED, ADD INDEX idx_invoice_lines_total (line_total)
