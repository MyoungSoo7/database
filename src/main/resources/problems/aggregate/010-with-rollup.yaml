id: "aggregate-010"
title: "지역별 합계와 총계 — WITH ROLLUP"
category: "aggregate"
difficulty: 2
description: |
  `sales` 테이블에서 지역(`region`)별 판매 금액(`amount`) 합계와, 맨 끝에 **전체 총계 행**을 함께 조회하세요.
  총계 행의 `region` 값은 문자열 `'전체'` 로 표시합니다.

  결과 컬럼은 `region`, `total_amount` 두 개입니다 (지역 4행 + 총계 1행). 정렬은 채점하지 않습니다.

  MySQL 의 `GROUP BY ... WITH ROLLUP` 은 소계/총계 행을 추가하며, 그 행의 그룹 컬럼은 NULL 로 나옵니다.
  `GROUPING(region)` 은 그 행이 ROLLUP 이 만든 행이면 1 을 돌려줍니다.
type: SELECT
schema: "schema.sql"
expected:
  columns: ["region", "total_amount"]
  rows:
    - ["광주", "350000"]
    - ["대구", "1860000"]
    - ["부산", "4850000"]
    - ["서울", "7995000"]
    - ["전체", "15055000"]
  orderMatters: false
hint: "GROUP BY region WITH ROLLUP, 그리고 IF(GROUPING(region) = 1, '전체', region)."
# 정답 예시 — 화면엔 안 나오고 오늘의 문제 풀이와 검증 테스트에 쓴다.
solution: |
  SELECT IF(GROUPING(region) = 1, '전체', region) AS region,
         SUM(amount) AS total_amount
  FROM sales
  GROUP BY region WITH ROLLUP
