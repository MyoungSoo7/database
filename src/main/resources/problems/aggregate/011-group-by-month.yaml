id: "aggregate-011"
title: "월별 매출 — 식으로 GROUP BY"
category: "aggregate"
difficulty: 2
description: |
  `sales` 테이블에서 **판매 월**별로 판매 건수와 금액 합계를 구하세요.
  판매 월은 `sale_date` 를 `'YYYY-MM'` 형식 문자열로 바꾼 값입니다 (예: `2024-11`).

  결과 컬럼은 `sale_month`, `sale_count`, `total_amount` 세 개입니다.
  정렬: `sale_month` 오름차순. 순서도 채점합니다.
type: SELECT
schema: "schema.sql"
expected:
  columns: ["sale_month", "sale_count", "total_amount"]
  rows:
    - ["2024-11", 3, "3850000"]
    - ["2024-12", 5, "2670000"]
    - ["2025-01", 5, "2700000"]
    - ["2025-02", 7, "5835000"]
  orderMatters: true
hint: "DATE_FORMAT(sale_date, '%Y-%m') 으로 만든 값으로 GROUP BY 할 수 있습니다."
# 정답 예시 — 화면엔 안 나오고 오늘의 문제 풀이와 검증 테스트에 쓴다.
solution: |
  SELECT DATE_FORMAT(sale_date, '%Y-%m') AS sale_month,
         COUNT(*) AS sale_count,
         SUM(amount) AS total_amount
  FROM sales
  GROUP BY DATE_FORMAT(sale_date, '%Y-%m')
  ORDER BY sale_month
