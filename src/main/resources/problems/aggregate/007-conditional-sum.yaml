id: "aggregate-007"
title: "연도별 매출을 옆으로 — 조건부 집계 SUM(CASE)"
category: "aggregate"
difficulty: 2
description: |
  `sales` 테이블에서 지역(`region`)별로 **2024년 매출**과 **2025년 매출**을 한 행에 나란히 보여주세요.

  - `amount_2024`: `sale_date` 가 2024년인 판매의 `amount` 합계
  - `amount_2025`: `sale_date` 가 2025년인 판매의 `amount` 합계
  - 해당 연도에 판매가 없으면 NULL 이 아니라 **0** 으로 나와야 합니다.

  결과 컬럼은 `region`, `amount_2024`, `amount_2025` 세 개입니다. 정렬은 채점하지 않습니다.
type: SELECT
schema: "schema.sql"
expected:
  columns: ["region", "amount_2024", "amount_2025"]
  rows:
    - ["서울", "3700000", "4295000"]
    - ["부산", "1300000", "3550000"]
    - ["대구", "1520000", "340000"]
    - ["광주", "0", "350000"]
  orderMatters: false
hint: "SUM(CASE WHEN 조건 THEN amount ELSE 0 END) — ELSE 0 이 없으면 어떻게 될까요?"
# 정답 예시 — 화면엔 안 나오고 오늘의 문제 풀이와 검증 테스트에 쓴다.
solution: |
  SELECT region,
         SUM(CASE WHEN YEAR(sale_date) = 2024 THEN amount ELSE 0 END) AS amount_2024,
         SUM(CASE WHEN YEAR(sale_date) = 2025 THEN amount ELSE 0 END) AS amount_2025
  FROM sales
  GROUP BY region
