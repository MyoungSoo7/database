id: "aggregate-006"
title: "2025년 많이 팔린 상품 — WHERE 와 HAVING 함께"
category: "aggregate"
difficulty: 2
description: |
  `sales` 테이블에서 **2025년(2025-01-01 이후) 판매 건만** 대상으로,
  상품(`product`)별 판매 수량(`qty`) 합계를 구하고 그 합계가 **8 이상**인 상품만 조회하세요.

  결과 컬럼은 `product`, `total_qty` 두 개입니다. 정렬은 채점하지 않습니다.

  생각해 볼 점: 날짜 조건은 그룹을 만들기 **전에** 행을 거르는 조건(WHERE)이고,
  수량 합계 조건은 그룹을 만든 **뒤에** 그룹을 거르는 조건(HAVING)입니다.
  날짜 조건을 빼면 결과가 어떻게 달라지는지도 확인해 보세요.
type: SELECT
schema: "schema.sql"
expected:
  columns: ["product", "total_qty"]
  rows:
    - ["모니터", "8"]
    - ["마우스", "16"]
  orderMatters: false
hint: "행 필터는 WHERE, 그룹 필터는 HAVING. 실행 순서는 WHERE → GROUP BY → HAVING."
# 정답 예시 — 화면엔 안 나오고 오늘의 문제 풀이와 검증 테스트에 쓴다.
solution: |
  SELECT product,
         SUM(qty) AS total_qty
  FROM sales
  WHERE sale_date >= '2025-01-01'
  GROUP BY product
  HAVING SUM(qty) >= 8
