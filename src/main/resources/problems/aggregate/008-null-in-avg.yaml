id: "aggregate-008"
title: "결시생은 평균에 들어갈까 — NULL 과 집계"
category: "aggregate"
difficulty: 2
description: |
  `scores` 테이블은 학생별 과목 점수이고, `score` 가 NULL 이면 결시(시험을 보지 않음)입니다.
  과목(`subject`)별로 다음을 구하세요.

  - `enrolled`: 그 과목의 행 수 (결시 포함)
  - `took_exam`: 실제로 시험을 본 학생 수 (`score` 가 NULL 이 아닌 행)
  - `avg_taken`: 시험 본 학생만의 평균 — `ROUND(..., 1)` 로 소수 첫째 자리까지
  - `avg_all`: 결시를 **0점으로 간주**한 평균 — `ROUND(..., 1)` 로 소수 첫째 자리까지

  결과 컬럼은 `subject`, `enrolled`, `took_exam`, `avg_taken`, `avg_all` 다섯 개입니다. 정렬은 채점하지 않습니다.
type: SELECT
schema: "schema.sql"
expected:
  columns: ["subject", "enrolled", "took_exam", "avg_taken", "avg_all"]
  rows:
    - ["국어", 6, 5, "79.0", "65.8"]
    - ["수학", 6, 5, "80.2", "66.8"]
    - ["영어", 6, 5, "83.4", "69.5"]
  orderMatters: false
hint: "AVG 는 NULL 을 분모에서도 뺍니다. 0 으로 치려면 COALESCE(score, 0)."
# 정답 예시 — 화면엔 안 나오고 오늘의 문제 풀이와 검증 테스트에 쓴다.
solution: |
  SELECT subject,
         COUNT(*) AS enrolled,
         COUNT(score) AS took_exam,
         ROUND(AVG(score), 1) AS avg_taken,
         ROUND(AVG(COALESCE(score, 0)), 1) AS avg_all
  FROM scores
  GROUP BY subject
