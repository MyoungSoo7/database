id: "aggregate-009"
title: "가장 많이 팔린 상품 3개 — GROUP BY + ORDER BY + LIMIT"
category: "aggregate"
difficulty: 1
description: |
  `sales` 테이블에서 상품(`product`)별 판매 수량(`qty`) 합계를 구해,
  합계가 큰 **상위 3개 상품**을 조회하세요.

  결과 컬럼은 `product`, `total_qty` 두 개입니다.
  정렬: `total_qty` 내림차순, 같으면 `product` 오름차순. 순서도 채점합니다.
type: SELECT
schema: "schema.sql"
expected:
  columns: ["product", "total_qty"]
  rows:
    - ["마우스", "30"]
    - ["키보드", "15"]
    - ["모니터", "10"]
  orderMatters: true
hint: "집계 결과의 별칭으로 ORDER BY 할 수 있습니다. 마지막에 LIMIT."
# 정답 예시 — 화면엔 안 나오고 오늘의 문제 풀이와 검증 테스트에 쓴다.
solution: |
  SELECT product,
         SUM(qty) AS total_qty
  FROM sales
  GROUP BY product
  ORDER BY total_qty DESC, product ASC
  LIMIT 3
