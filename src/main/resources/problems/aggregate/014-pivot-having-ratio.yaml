id: "aggregate-014"
title: "할인 판매 비율 50% 이상 상품 — 조건부 집계 피벗 + HAVING 비율"
category: "aggregate"
difficulty: 3
description: |
  `sales` 테이블에서 상품(`product`)별로 연도별 판매 건수를 옆으로 펼치고,
  **할인 판매 비율**이 50% 이상인 상품만 조회하세요.

  - `cnt_2024`: `sale_date` 가 2024년인 판매 건수 (없으면 0)
  - `cnt_2025`: `sale_date` 가 2025년인 판매 건수 (없으면 0)
  - `discount_pct`: 그 상품의 전체 판매 건수 중 `discount` 가 **NULL 이 아닌** 판매 건수의 비율(%)을
    `ROUND(값, 1)` 로 소수 첫째 자리까지. (할인 금액이 아니라 **건수** 비율입니다.)
  - 조건: 할인 판매 비율이 50% 이상 (반올림 전 값 기준 `>= 50`)

  결과 컬럼은 `product`, `cnt_2024`, `cnt_2025`, `discount_pct` 네 개입니다. 정렬은 채점하지 않습니다.
type: SELECT
schema: "schema.sql"
expected:
  columns: ["product", "cnt_2024", "cnt_2025", "discount_pct"]
  rows:
    - ["노트북", "3", "3", "66.7"]
    - ["모니터", "1", "3", "75.0"]
  orderMatters: false
hint: "SUM(CASE WHEN ... THEN 1 ELSE 0 END) 로 연도별 건수를 펼치고, COUNT(discount) 는 NULL 을 세지 않는다는 점을 이용해 HAVING 에서 비율을 거릅니다."
# 정답 예시 — 화면엔 안 나오고 오늘의 문제 풀이와 검증 테스트에 쓴다.
solution: |
  SELECT product,
         SUM(CASE WHEN YEAR(sale_date) = 2024 THEN 1 ELSE 0 END) AS cnt_2024,
         SUM(CASE WHEN YEAR(sale_date) = 2025 THEN 1 ELSE 0 END) AS cnt_2025,
         ROUND(100 * SUM(CASE WHEN discount IS NOT NULL THEN 1 ELSE 0 END) / COUNT(*), 1) AS discount_pct
  FROM sales
  GROUP BY product
  HAVING 100 * SUM(CASE WHEN discount IS NOT NULL THEN 1 ELSE 0 END) / COUNT(*) >= 50
