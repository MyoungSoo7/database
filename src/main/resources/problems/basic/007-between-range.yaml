id: "basic-007"
title: "BETWEEN — 양 끝을 포함하는 범위"
category: "basic"
difficulty: 1
description: |
  `products` 테이블에서 가격(`price`)이 15000 이상 32000 이하인 상품을 조회하세요.
  결과 컬럼은 `name`, `price` 두 개입니다.

  `BETWEEN a AND b` 는 `>= a AND <= b` 와 같습니다. 즉 *양 끝값(15000, 32000)도 포함* 됩니다.
type: SELECT
schema: "schema.sql"
expected:
  columns: ["name", "price"]
  rows:
    - ["게이밍 마우스", 32000]
    - ["노트북 거치대", 25000]
    - ["A4 복사용지", 21000]
    - ["스테인리스 텀블러", 18000]
    - ["데스크 매트", 15000]
    - ["무선 충전기", 29000]
    - ["독서대", 32000]
    - ["전기 포트", 32000]
  orderMatters: false
hint: "WHERE price BETWEEN 작은값 AND 큰값"
# 정답 예시 — 화면엔 안 나오고 오늘의 문제 풀이와 검증 테스트에 쓴다.
solution: |
  SELECT name, price
  FROM products
  WHERE price BETWEEN 15000 AND 32000
