id: "basic-004"
title: "AND 와 OR — 괄호가 필요한 이유"
category: "basic"
difficulty: 2
description: |
  `products` 테이블에서 카테고리가 `'전자기기'` 또는 `'생활용품'` 이면서, 가격(`price`)이 30000 *미만* 인 상품을 조회하세요.
  결과 컬럼은 `name`, `category`, `price` 세 개입니다.

  주의: SQL 에서 `AND` 는 `OR` 보다 먼저 계산됩니다.
  괄호 없이 `A OR B AND C` 라고 쓰면 `A OR (B AND C)` 로 해석되어, 비싼 전자기기까지 섞여 나옵니다.
type: SELECT
schema: "schema.sql"
expected:
  columns: ["name", "category", "price"]
  rows:
    - ["USB-C 케이블", "전자기기", 9000]
    - ["스테인리스 텀블러", "생활용품", 18000]
    - ["무선 충전기", "전자기기", 29000]
    - ["머그컵", "생활용품", 8000]
  orderMatters: false
hint: "카테고리 두 개를 묶는 OR 조건을 괄호로 감싼 뒤 AND 로 가격 조건을 붙인다"
# 정답 예시 — 화면엔 안 나오고 오늘의 문제 풀이와 검증 테스트에 쓴다.
solution: |
  SELECT name, category, price
  FROM products
  WHERE (category = '전자기기' OR category = '생활용품') AND price < 30000
