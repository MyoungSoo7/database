id: "basic-011"
title: "DISTINCT — 중복 없는 목록"
category: "basic"
difficulty: 1
description: |
  `products` 테이블에서 재고(`stock`)가 10 *이하* 인 상품이 하나라도 있는 카테고리 목록을 *중복 없이* 조회하세요.
  결과 컬럼은 `category` 하나입니다.

  `SELECT DISTINCT 컬럼` 은 결과에서 같은 값을 한 번만 남깁니다.
type: SELECT
schema: "schema.sql"
expected:
  columns: ["category"]
  rows:
    - ["전자기기"]
    - ["사무용품"]
  orderMatters: false
hint: "SELECT DISTINCT category ... WHERE stock <= 10"
# 정답 예시 — 화면엔 안 나오고 오늘의 문제 풀이와 검증 테스트에 쓴다.
solution: |
  SELECT DISTINCT category
  FROM products
  WHERE stock <= 10
