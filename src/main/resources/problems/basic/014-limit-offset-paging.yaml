id: "basic-014"
title: "LIMIT OFFSET — 목록의 2페이지"
category: "basic"
difficulty: 2
description: |
  쇼핑몰 상품 목록을 한 페이지에 4개씩 보여줍니다.
  정렬은 가격(`price`) 내림차순이고, 가격이 같으면 `id` 오름차순입니다.
  이때 *2페이지* (전체 순서에서 5~8번째) 에 나오는 상품을 조회하세요.
  결과 컬럼은 `id`, `name`, `price` 세 개이며, 위 정렬 순서 그대로 출력합니다. *정렬 순서가 채점 대상* 입니다.

  `LIMIT 개수 OFFSET 건너뛸행수` (또는 `LIMIT 건너뛸행수, 개수`).
  가격이 같은 상품이 여럿이므로 동률을 깨는 2차 정렬키가 없으면 페이지 경계가 흔들립니다.
type: SELECT
schema: "schema.sql"
expected:
  columns: ["id", "name", "price"]
  rows:
    - [2, "게이밍 마우스", 32000]
    - [14, "독서대", 32000]
    - [15, "전기 포트", 32000]
    - [12, "무선 충전기", 29000]
  orderMatters: true
hint: "앞 페이지 4개를 건너뛴다 — ORDER BY 에 동률을 깨는 키도 넣을 것"
# 정답 예시 — 화면엔 안 나오고 오늘의 문제 풀이와 검증 테스트에 쓴다.
solution: |
  SELECT id, name, price
  FROM products
  ORDER BY price DESC, id ASC
  LIMIT 4 OFFSET 4
