id: "basic-008"
title: "LIKE — 특정 글자로 시작하는 이름"
category: "basic"
difficulty: 1
description: |
  `employees` 테이블에서 이름(`name`)이 `'김'` 으로 *시작하는* 직원을 조회하세요.
  결과 컬럼은 `name`, `department` 두 개입니다.

  `LIKE` 의 와일드카드: `%` 는 0글자 이상 아무 문자열, `_` 는 정확히 1글자.
type: SELECT
schema: "schema.sql"
expected:
  columns: ["name", "department"]
  rows:
    - ["김철수", "개발팀"]
    - ["김도윤", "기획팀"]
    - ["김하은", "디자인팀"]
  orderMatters: false
hint: "WHERE name LIKE '김%'"
# 정답 예시 — 화면엔 안 나오고 오늘의 문제 풀이와 검증 테스트에 쓴다.
solution: |
  SELECT name, department
  FROM employees
  WHERE name LIKE '김%'
