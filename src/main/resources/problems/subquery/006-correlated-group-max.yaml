id: "subquery-006"
title: "장르별 가장 비싼 책 — 상관 서브쿼리"
category: "subquery"
difficulty: 2
description: |
  각 장르(`genre`)에서 *가격이 가장 비싼* 책을 조회하세요.
  결과 컬럼은 `genre`, `title`, `price` 세 개입니다. (장르 안에서 가격이 같은 책은 없습니다.)

  바깥 쿼리의 현재 행(`b.genre`)을 안쪽 서브쿼리가 참조하는 **상관 서브쿼리** 로 풀어 보세요.
  서브쿼리가 바깥 행마다 다시 계산되어 "그 행이 속한 장르의 최댓값" 을 돌려줍니다.
type: SELECT
schema: "schema.sql"
expected:
  columns: ["genre", "title", "price"]
  rows:
    - ["소설", "노르웨이의 숲", 16500]
    - ["에세이", "달리기를 말할 때 내가 하고 싶은 이야기", 14000]
    - ["추리", "백야행", 18000]
    - ["고전", "천자문", 7000]
    - ["시", "옛 민요 모음", 9500]
  orderMatters: false
hint: "WHERE b.price = (SELECT MAX(price) FROM books b2 WHERE b2.genre = b.genre)"
# 정답 예시 — 화면엔 안 나오고 오늘의 문제 풀이와 검증 테스트에 쓴다.
solution: |
  SELECT b.genre, b.title, b.price
  FROM books b
  WHERE b.price = (SELECT MAX(b2.price) FROM books b2 WHERE b2.genre = b.genre)
