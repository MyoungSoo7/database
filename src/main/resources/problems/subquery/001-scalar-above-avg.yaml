id: "subquery-001"
title: "평균 가격보다 비싼 책"
category: "subquery"
difficulty: 1
description: |
  `books` 테이블에서 *전체 책의 평균 가격보다 비싼* 책을 조회하세요.
  결과 컬럼은 `title`, `price` 두 개입니다.

  평균값은 미리 알 수 없으니, WHERE 절 안에서 한 값(1행 1열)을 돌려주는
  **스칼라 서브쿼리** 로 구해 비교합니다.
type: SELECT
schema: "schema.sql"
expected:
  columns: ["title", "price"]
  rows:
    - ["채식주의자", 13500]
    - ["소년이 온다", 15000]
    - ["여행의 이유", 13000]
    - ["노르웨이의 숲", 16500]
    - ["달리기를 말할 때 내가 하고 싶은 이야기", 14000]
    - ["종의 기원", 14500]
    - ["용의자 X의 헌신", 15500]
    - ["나미야 잡화점의 기적", 16000]
    - ["백야행", 18000]
  orderMatters: false
hint: "WHERE price > (SELECT AVG(...) FROM ...)"
# 정답 예시 — 화면엔 안 나오고 오늘의 문제 풀이와 검증 테스트에 쓴다.
solution: |
  SELECT title, price
  FROM books
  WHERE price > (SELECT AVG(price) FROM books)
