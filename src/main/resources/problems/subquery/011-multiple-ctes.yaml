id: "subquery-011"
title: "평균보다 많이 빌린 독자 — CTE 여러 개 연결"
category: "subquery"
difficulty: 2
description: |
  *대출 이력이 있는 독자들의 평균 대출 건수* 보다 많이 빌린 독자를 조회하세요.
  결과 컬럼은 `name`, `loan_count` 두 개입니다. (대출 이력이 없는 독자는 평균 계산에 넣지 않습니다.)

  CTE 는 쉼표로 여러 개 이어 쓸 수 있고, 뒤의 CTE 가 앞의 CTE 를 참조할 수 있습니다.
  1) `reader_loans` : 독자별 대출 건수
  2) `avg_loans` : 1) 의 평균
  3) 본 쿼리 : 둘을 비교
type: SELECT
schema: "schema.sql"
expected:
  columns: ["name", "loan_count"]
  rows:
    - ["김민준", 4]
    - ["정도윤", 4]
  orderMatters: false
hint: "WITH reader_loans AS (...), avg_loans AS (SELECT AVG(loan_count) AS v FROM reader_loans) SELECT ..."
# 정답 예시 — 화면엔 안 나오고 오늘의 문제 풀이와 검증 테스트에 쓴다.
solution: |
  WITH reader_loans AS (
    SELECT reader_id, COUNT(*) AS loan_count
    FROM loans
    GROUP BY reader_id
  ),
  avg_loans AS (
    SELECT AVG(loan_count) AS v FROM reader_loans
  )
  SELECT r.name, rl.loan_count
  FROM reader_loans rl
  JOIN readers r ON r.id = rl.reader_id
  CROSS JOIN avg_loans a
  WHERE rl.loan_count > a.v
