id: "subquery-012"
title: "독자별 가장 최근 대출 — 그룹별 최댓값을 가진 행"
category: "subquery"
difficulty: 2
description: |
  대출 이력이 있는 각 독자에 대해 *가장 최근에 빌린 책* 을 조회하세요.
  결과 컬럼은 `name`, `title`, `loan_date` 세 개입니다. (한 독자가 같은 날 두 권 빌린 경우는 없습니다.)

  `SELECT reader_id, MAX(loan_date) ... GROUP BY reader_id` 만으로는 책 제목을 가져올 수 없습니다
  (GROUP BY 에 없는 컬럼은 ONLY_FULL_GROUP_BY 에서 에러).
  "독자별 최근 날짜" 를 파생 테이블로 구한 뒤, 원래 `loans` 와 (reader_id, 날짜) 로 다시 JOIN 해
  그 행 전체를 찾아오는 것이 고전적인 **groupwise max** 패턴입니다.
type: SELECT
schema: "schema.sql"
expected:
  columns: ["name", "title", "loan_date"]
  rows:
    - ["이서연", "백야행", "2025-02-20"]
    - ["정도윤", "종의 기원", "2025-03-20"]
    - ["강하은", "백야행", "2025-03-10"]
    - ["김민준", "노르웨이의 숲", "2025-03-25"]
    - ["박지호", "소년이 온다", "2025-03-28"]
    - ["최수아", "나미야 잡화점의 기적", "2025-02-27"]
  orderMatters: false
hint: "JOIN (SELECT reader_id, MAX(loan_date) AS last_date FROM loans GROUP BY reader_id) m ON ..."
# 정답 예시 — 화면엔 안 나오고 오늘의 문제 풀이와 검증 테스트에 쓴다.
solution: |
  SELECT r.name, b.title, l.loan_date
  FROM loans l
  JOIN (SELECT reader_id, MAX(loan_date) AS last_date
        FROM loans GROUP BY reader_id) m
    ON m.reader_id = l.reader_id AND m.last_date = l.loan_date
  JOIN readers r ON r.id = l.reader_id
  JOIN books b ON b.id = l.book_id
