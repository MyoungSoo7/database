id: "subquery-015"
title: "장르별 비싼 책 2권 — 윈도우 함수 없이 상관 서브쿼리 COUNT"
category: "subquery"
difficulty: 3
description: |
  `books` 에서 **장르(`genre`)별로 가격이 가장 비싼 책 2권**과 그 장르 안에서의 가격 순위를 조회하세요.
  책이 2권 미만인 장르는 있는 책만 나옵니다. (같은 장르 안에서 가격이 같은 책은 없습니다.)

  - `price_rank`: 같은 장르에서 자기보다 **비싼 책의 수 + 1** (가장 비싼 책이 1)

  결과 컬럼은 `genre`, `title`, `price`, `price_rank` 네 개입니다.
  결과는 `genre` 오름차순, 같으면 `price_rank` 오름차순이며 **정렬도 채점합니다**.

  목표는 `ROW_NUMBER()` 같은 **윈도우 함수 없이**, "나보다 비싼 책이 몇 권인가" 를 세는 상관 서브쿼리로 푸는 것입니다
  (윈도우 함수가 없던 MySQL 5.7 시절의 그룹별 Top-N 표준 기법).
  채점은 결과만 보므로 윈도우 함수로 풀어도 통과하지만, 연습 목적상 상관 서브쿼리로 풀어 보세요.
type: SELECT
schema: "schema.sql"
expected:
  columns: ["genre", "title", "price", "price_rank"]
  rows:
    - ["고전", "천자문", 7000, 1]
    - ["소설", "노르웨이의 숲", 16500, 1]
    - ["소설", "나미야 잡화점의 기적", 16000, 2]
    - ["시", "옛 민요 모음", 9500, 1]
    - ["에세이", "달리기를 말할 때 내가 하고 싶은 이야기", 14000, 1]
    - ["에세이", "여행의 이유", 13000, 2]
    - ["추리", "백야행", 18000, 1]
    - ["추리", "용의자 X의 헌신", 15500, 2]
  orderMatters: true
hint: "WHERE (SELECT COUNT(*) FROM books b2 WHERE b2.genre = b.genre AND b2.price > b.price) < 2 — 같은 식에 +1 하면 순위가 됩니다."
# 정답 예시 — 화면엔 안 나오고 오늘의 문제 풀이와 검증 테스트에 쓴다.
solution: |
  SELECT b.genre,
         b.title,
         b.price,
         (SELECT COUNT(*) FROM books b2
          WHERE b2.genre = b.genre AND b2.price > b.price) + 1 AS price_rank
  FROM books b
  WHERE (SELECT COUNT(*) FROM books b2
         WHERE b2.genre = b.genre AND b2.price > b.price) < 2
  ORDER BY b.genre, price_rank
