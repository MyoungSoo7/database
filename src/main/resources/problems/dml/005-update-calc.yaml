id: "dml-005"
title: "UPDATE — 문구류 가격 10% 인상"
category: "dml"
difficulty: 1
description: |
  `items` 에서 `category` 가 `'문구'` 인 상품의 `price` 를 **10% 올린 값**(기존 가격 × 1.1)으로 바꾸세요.
  대상 상품의 결과 가격은 모두 정수로 딱 떨어집니다 (예: 1500 → 1650).

  다른 카테고리 상품의 가격과 모든 상품의 다른 컬럼은 그대로 두어야 합니다.

  제출은 SQL **한 문장**입니다. 채점은 초기 데이터에 제출한 문장을 실행한 뒤 테이블 상태를 확인합니다.
  바꾸라고 한 것 말고는 아무것도 바뀌면 안 되고, 문자열 값은 대소문자까지 정확히 맞아야 합니다.
type: DDL
schema: "schema.sql"
validation:
  type: QUERY
  checkPerProfile:
    mysql: "SELECT CASE WHEN CAST((SELECT GROUP_CONCAT(CONCAT_WS(':',id,name,category,price,stock,status) ORDER BY id SEPARATOR ',') FROM items) AS BINARY) = CAST('1:볼펜:문구:1650:120:ON_SALE,2:노트:문구:3300:80:ON_SALE,3:형광펜:문구:1320:0:SOLD_OUT,4:생수 2L:식품:1100:200:ON_SALE,5:컵라면:식품:1300:150:ON_SALE,6:초코바:식품:1700:60:ON_SALE,7:보조배터리:전자:32000:15:ON_SALE,8:USB 케이블:전자:8900:40:ON_SALE,9:이어폰:전자:45000:0:SOLD_OUT,10:우산:생활:9800:25:ON_SALE' AS BINARY) THEN 1 ELSE 0 END"
  expectedValue: 1
hint: "SET 오른쪽에 자기 자신을 쓸 수 있습니다: SET price = price * 1.1"
# 정답 예시 — 화면엔 안 나오고 오늘의 문제 풀이와 검증 테스트에 쓴다.
solution: |
  UPDATE items SET price = price * 1.1 WHERE category = '문구'
