id: "dml-003"
title: "INSERT ... SELECT — 식품 상품 백업"
category: "dml"
difficulty: 2
description: |
  `item_backup` 은 `items` 와 컬럼 구조(`id`, `name`, `category`, `price`, `stock`, `status`)가 같은 **빈** 테이블입니다.
  `items` 중 `category` 가 `'식품'` 인 상품을 **모든 컬럼 값 그대로** `item_backup` 에 복사하세요.

  - 다른 카테고리 상품은 복사하지 않습니다.
  - `items` 는 그대로 남아 있어야 합니다(옮기기가 아니라 복사).

  제출은 SQL **한 문장**입니다. 채점은 초기 데이터에 제출한 문장을 실행한 뒤 테이블 상태를 확인합니다.
  바꾸라고 한 것 말고는 아무것도 바뀌면 안 되고, 문자열 값은 대소문자까지 정확히 맞아야 합니다.
type: DDL
schema: "schema.sql"
validation:
  type: QUERY
  checkPerProfile:
    mysql: "SELECT CASE WHEN CAST((SELECT GROUP_CONCAT(CONCAT_WS(':',id,name,category,price,stock,status) ORDER BY id SEPARATOR ',') FROM item_backup) AS BINARY) = CAST('4:생수 2L:식품:1100:200:ON_SALE,5:컵라면:식품:1300:150:ON_SALE,6:초코바:식품:1700:60:ON_SALE' AS BINARY) AND (SELECT COUNT(*) FROM items) = 10 THEN 1 ELSE 0 END"
  expectedValue: 1
hint: "INSERT INTO 대상 (컬럼...) SELECT 컬럼... FROM 원본 WHERE 조건 — VALUES 대신 SELECT 결과를 넣습니다."
# 정답 예시 — 화면엔 안 나오고 오늘의 문제 풀이와 검증 테스트에 쓴다.
solution: |
  INSERT INTO item_backup SELECT * FROM items WHERE category = '식품'
