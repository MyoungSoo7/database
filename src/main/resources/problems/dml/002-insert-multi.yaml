id: "dml-002"
title: "INSERT — 공지 여러 건 한 번에 추가"
category: "dml"
difficulty: 1
description: |
  `notices` 테이블에 아래 공지 3건을 **한 문장으로** 추가하세요. `is_pinned` 는 상단 고정 여부(1=고정, 0=일반)입니다.

  | id | title | author | created_at | is_pinned |
  |----|-------|--------|------------|-----------|
  | 9 | 여름 휴가 배송 안내 | 운영팀 | 2025-07-20 | 0 |
  | 10 | 앱 업데이트 안내 | 개발팀 | 2025-07-22 | 0 |
  | 11 | 회원 등급 개편 안내 | 마케팅팀 | 2025-07-25 | 1 |

  기존 공지 8건은 그대로 두어야 합니다.

  제출은 SQL **한 문장**입니다. 채점은 초기 데이터에 제출한 문장을 실행한 뒤 테이블 상태를 확인합니다.
  바꾸라고 한 것 말고는 아무것도 바뀌면 안 되고, 문자열 값은 대소문자까지 정확히 맞아야 합니다.
type: DDL
schema: "schema.sql"
validation:
  type: QUERY
  checkPerProfile:
    mysql: "SELECT CASE WHEN CAST((SELECT GROUP_CONCAT(CONCAT_WS(':',id,title,author,created_at,is_pinned) ORDER BY id SEPARATOR ',') FROM notices) AS BINARY) = CAST('1:서비스 오픈 안내:운영팀:2024-03-01:1,2:설 연휴 배송 안내:운영팀:2024-02-05:0,3:개인정보처리방침 개정:법무팀:2024-08-20:1,4:추석 연휴 배송 안내:운영팀:2024-09-10:0,5:서버 점검 안내:개발팀:2024-12-30:0,6:신규 결제수단 추가:개발팀:2025-01-02:0,7:봄맞이 이벤트:마케팅팀:2025-03-15:0,8:이용약관 개정:법무팀:2025-04-01:1,9:여름 휴가 배송 안내:운영팀:2025-07-20:0,10:앱 업데이트 안내:개발팀:2025-07-22:0,11:회원 등급 개편 안내:마케팅팀:2025-07-25:1' AS BINARY) THEN 1 ELSE 0 END"
  expectedValue: 1
hint: "VALUES 뒤에 (...), (...), (...) 처럼 여러 행을 쉼표로 이어 쓸 수 있습니다."
# 정답 예시 — 화면엔 안 나오고 오늘의 문제 풀이와 검증 테스트에 쓴다.
solution: |
  INSERT INTO notices (id, title, author, created_at, is_pinned) VALUES (9, '여름 휴가 배송 안내', '운영팀', '2025-07-20', 0), (10, '앱 업데이트 안내', '개발팀', '2025-07-22', 0), (11, '회원 등급 개편 안내', '마케팅팀', '2025-07-25', 1)
