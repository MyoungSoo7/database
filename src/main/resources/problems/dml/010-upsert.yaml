id: "dml-010"
title: "INSERT ... ON DUPLICATE KEY UPDATE — 입고 upsert"
category: "dml"
difficulty: 2
description: |
  아래 입고 2건을 `items` 에 **한 문장으로** 반영하세요.

  | id | name | category | price | 입고 수량 | status |
  |----|------|----------|-------|-----------|--------|
  | 4 | 생수 2L | 식품 | 1100 | 50 | ON_SALE |
  | 11 | 물티슈 | 생활 | 2500 | 40 | ON_SALE |

  - `id` 가 이미 있는 상품은 `stock` 에 입고 수량을 **더하고**, 다른 컬럼은 그대로 둡니다.
  - 없는 상품은 새 행으로 추가하며 `stock` 은 입고 수량입니다.

  (`REPLACE INTO` 는 기존 행을 지우고 새로 넣기 때문에 기존 재고가 사라집니다.)

  제출은 SQL **한 문장**입니다. 채점은 초기 데이터에 제출한 문장을 실행한 뒤 테이블 상태를 확인합니다.
  바꾸라고 한 것 말고는 아무것도 바뀌면 안 되고, 문자열 값은 대소문자까지 정확히 맞아야 합니다.
type: DDL
schema: "schema.sql"
validation:
  type: QUERY
  checkPerProfile:
    mysql: "SELECT CASE WHEN CAST((SELECT GROUP_CONCAT(CONCAT_WS(':',id,name,category,price,stock,status) ORDER BY id SEPARATOR ',') FROM items) AS BINARY) = CAST('1:볼펜:문구:1500:120:ON_SALE,2:노트:문구:3000:80:ON_SALE,3:형광펜:문구:1200:0:SOLD_OUT,4:생수 2L:식품:1100:250:ON_SALE,5:컵라면:식품:1300:150:ON_SALE,6:초코바:식품:1700:60:ON_SALE,7:보조배터리:전자:32000:15:ON_SALE,8:USB 케이블:전자:8900:40:ON_SALE,9:이어폰:전자:45000:0:SOLD_OUT,10:우산:생활:9800:25:ON_SALE,11:물티슈:생활:2500:40:ON_SALE' AS BINARY) THEN 1 ELSE 0 END"
  expectedValue: 1
hint: "INSERT INTO items (...) VALUES (...), (...) AS new ON DUPLICATE KEY UPDATE stock = items.stock + new.stock — 8.0.19 이전 문법은 VALUES(stock)."
# 정답 예시 — 화면엔 안 나오고 오늘의 문제 풀이와 검증 테스트에 쓴다.
solution: |
  INSERT INTO items (id, name, category, price, stock, status) VALUES (4, '생수 2L', '식품', 1100, 50, 'ON_SALE'), (11, '물티슈', '생활', 2500, 40, 'ON_SALE') AS new ON DUPLICATE KEY UPDATE stock = items.stock + new.stock
