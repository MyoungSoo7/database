id: "window-006"
title: "지역별 첫 달·마지막 달 매출 — FIRST_VALUE / LAST_VALUE 와 프레임"
category: "window"
difficulty: 2
description: |
  `monthly_revenue` 의 각 행 옆에 *같은 지역의 첫 달(2025-01) 매출* 과
  *마지막 달(2025-04) 매출* 을 붙이세요.
  결과 컬럼은 `region`, `month`, `revenue`, `first_revenue`, `last_revenue` 다섯 개입니다.

  **프레임 함정**: ORDER BY 가 있는 윈도우의 기본 프레임은
  `RANGE BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW` 입니다.
  그래서 `LAST_VALUE` 를 그냥 쓰면 "파티션의 마지막" 이 아니라 "현재 행" 값이 나옵니다.
  프레임을 `ROWS BETWEEN UNBOUNDED PRECEDING AND UNBOUNDED FOLLOWING` 으로 넓혀야 합니다.
type: SELECT
schema: "schema.sql"
expected:
  columns: ["region", "month", "revenue", "first_revenue", "last_revenue"]
  rows:
    - ["대구", "2025-01", 200, 200, 250]
    - ["대구", "2025-02", 200, 200, 250]
    - ["대구", "2025-03", 150, 200, 250]
    - ["대구", "2025-04", 250, 200, 250]
    - ["부산", "2025-01", 300, 300, 400]
    - ["부산", "2025-02", 350, 300, 400]
    - ["부산", "2025-03", 250, 300, 400]
    - ["부산", "2025-04", 400, 300, 400]
    - ["서울", "2025-01", 500, 500, 550]
    - ["서울", "2025-02", 450, 500, 550]
    - ["서울", "2025-03", 600, 500, 550]
    - ["서울", "2025-04", 550, 500, 550]
  orderMatters: false
hint: "LAST_VALUE(revenue) OVER (PARTITION BY region ORDER BY month ROWS BETWEEN UNBOUNDED PRECEDING AND UNBOUNDED FOLLOWING)"
# 정답 예시 — 화면엔 안 나오고 오늘의 문제 풀이와 검증 테스트에 쓴다.
solution: |
  SELECT region, month, revenue,
         FIRST_VALUE(revenue) OVER (PARTITION BY region ORDER BY month) AS first_revenue,
         LAST_VALUE(revenue) OVER (PARTITION BY region ORDER BY month
                                   ROWS BETWEEN UNBOUNDED PRECEDING AND UNBOUNDED FOLLOWING) AS last_revenue
  FROM monthly_revenue
