id: "window-010"
title: "30분 규칙으로 세션 나누기 — LAG + 누적 SUM"
category: "window"
difficulty: 3
description: |
  `click_events` 는 사용자(`user_name`)별 클릭 시각(`event_time`, DATETIME) 로그입니다. 같은 사용자의 클릭 시각은 겹치지 않습니다.
  다음 규칙으로 클릭을 **세션**으로 나누세요.

  - 사용자의 첫 클릭은 새 세션을 시작합니다.
  - 같은 사용자의 **바로 이전 클릭**과의 간격이 **30분을 초과**하면 새 세션을 시작합니다.
    간격이 정확히 30분이면 같은 세션입니다. 날짜가 바뀌어도(자정을 넘겨도) 간격만 봅니다.

  사용자별 세션 수와, 한 세션에 들어간 클릭 수의 최댓값을 구하세요.
  결과 컬럼은 `user_name`, `session_count`, `max_events` 세 개입니다. 정렬은 채점하지 않습니다.

  기법: `LAG` 로 이전 클릭과의 간격을 구해 새 세션이면 1, 아니면 0 인 플래그를 만들고,
  그 플래그의 **누적 합**(`SUM() OVER (... ORDER BY event_time)`)을 세션 번호로 씁니다.
type: SELECT
schema: "adv-schema.sql"
expected:
  columns: ["user_name", "session_count", "max_events"]
  rows:
    - ["민지", 3, 3]
    - ["서윤", 1, 1]
    - ["준호", 2, 4]
  orderMatters: false
hint: "TIMESTAMPDIFF(MINUTE, LAG(event_time) OVER (PARTITION BY user_name ORDER BY event_time), event_time) — 첫 클릭은 LAG 가 NULL 이라는 점을 CASE 에서 챙기세요."
# 정답 예시 — 화면엔 안 나오고 오늘의 문제 풀이와 검증 테스트에 쓴다.
solution: |
  WITH f AS (
      SELECT user_name, event_time,
             CASE WHEN TIMESTAMPDIFF(MINUTE,
                          LAG(event_time) OVER (PARTITION BY user_name ORDER BY event_time),
                          event_time) <= 30
                  THEN 0 ELSE 1 END AS is_new
      FROM click_events
  ),
  s AS (
      SELECT user_name,
             SUM(is_new) OVER (PARTITION BY user_name ORDER BY event_time) AS session_no
      FROM f
  ),
  c AS (
      SELECT user_name, session_no, COUNT(*) AS cnt
      FROM s
      GROUP BY user_name, session_no
  )
  SELECT user_name,
         COUNT(*) AS session_count,
         MAX(cnt) AS max_events
  FROM c
  GROUP BY user_name
