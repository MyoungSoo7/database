id: "func-011"
title: "IF · ABS — 모집 상태와 정원 차이"
category: "func"
difficulty: 1
description: |
  정원(`capacity`)이 정해진 행사(`capacity > 0`)에 대해 다음을 구하세요.
  - `status`: 신청 인원(`registered`)이 정원 *이상* 이면 `'마감'`, 아니면 `'모집중'`
  - `gap`: 정원과 신청 인원의 차이를 *절댓값* 으로 (초과든 미달이든 양수)

  결과 컬럼은 `title`, `status`, `gap` 세 개입니다.

  `IF(조건, 참일때값, 거짓일때값)` 은 분기가 둘뿐인 CASE 의 MySQL 축약형입니다.
type: SELECT
schema: "schema.sql"
expected:
  columns: ["title", "status", "gap"]
  rows:
    - ["SQL 입문 스터디", "모집중", 2]
    - ["백엔드 밋업", "마감", 0]
    - ["데이터 분석 부트캠프", "모집중", 8]
    - ["클라우드 워크숍", "마감", 1]
    - ["알고리즘 캠프", "모집중", 16]
    - ["해커톤", "모집중", 24]
    - ["면접 특강", "마감", 0]
    - ["오픈소스 기여 행사", "모집중", 45]
  orderMatters: false
hint: "IF(registered >= capacity, ..., ...) 와 ABS(capacity - registered)"
# 정답 예시 — 화면엔 안 나오고 오늘의 문제 풀이와 검증 테스트에 쓴다.
solution: |
  SELECT title,
         IF(registered >= capacity, '마감', '모집중') AS status,
         ABS(capacity - registered) AS gap
  FROM events
  WHERE capacity > 0
