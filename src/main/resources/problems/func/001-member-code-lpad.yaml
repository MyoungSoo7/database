id: "func-001"
title: "CONCAT · LPAD · UPPER — 회원 코드 만들기"
category: "func"
difficulty: 1
description: |
  `members` 의 모든 회원에 대해 회원 코드와 대문자 등급을 만드세요.
  - `member_code`: `'M-'` 뒤에 `id` 를 *4자리로 0 채움* (예: id 7 → `'M-0007'`)
  - `grade`: 등급(`grade`)을 *대문자* 로 (예: `'gold'` → `'GOLD'`)

  결과 컬럼은 `member_code`, `name`, `grade` 세 개이고 `id` 오름차순입니다. *정렬 순서가 채점 대상* 입니다.
type: SELECT
schema: "schema.sql"
expected:
  columns: ["member_code", "name", "grade"]
  rows:
    - ["M-0001", "김철수", "GOLD"]
    - ["M-0002", "이영희", "SILVER"]
    - ["M-0003", "박민", "BRONZE"]
    - ["M-0004", "남궁민수", "GOLD"]
    - ["M-0005", "Tom", "SILVER"]
    - ["M-0006", "최지훈", "BRONZE"]
    - ["M-0007", "정수연", "VIP"]
    - ["M-0008", "황보", "SILVER"]
    - ["M-0009", "제갈공명", "BRONZE"]
    - ["M-0010", "Alice", "GOLD"]
    - ["M-0011", "윤하늘", "BRONZE"]
    - ["M-0012", "서지아", "SILVER"]
  orderMatters: true
hint: "LPAD(값, 길이, 채울문자) 로 0을 채우고 CONCAT 으로 접두어를 붙인다"
# 정답 예시 — 화면엔 안 나오고 오늘의 문제 풀이와 검증 테스트에 쓴다.
solution: |
  SELECT CONCAT('M-', LPAD(id, 4, '0')) AS member_code, name, UPPER(grade) AS grade
  FROM members
  ORDER BY id
