id: "func-009"
title: "DATEDIFF + 1 · DATE_SUB — 행사 기간과 얼리버드 마감일"
category: "func"
difficulty: 2
description: |
  여러 날 진행되는(시작일과 종료일이 다른) 행사에 대해 다음을 구하세요.
  - `days`: 행사 기간 일수. *시작일과 종료일을 모두 포함* 해서 셉니다 (예: 4월 19일~20일 → 2일).
  - `early_deadline`: 얼리버드 신청 마감일 = 시작일(`start_date`)의 *7일 전* 날짜 (DATE).

  결과 컬럼은 `title`, `days`, `early_deadline` 세 개이고 `id` 오름차순입니다. *정렬 순서가 채점 대상* 입니다.

  `DATEDIFF(end, start)` 는 '차이' 라서 같은 날이면 0 입니다. 양 끝 포함 일수는 1을 더해야 합니다.
type: SELECT
schema: "schema.sql"
expected:
  columns: ["title", "days", "early_deadline"]
  rows:
    - ["데이터 분석 부트캠프", 12, "2025-02-24"]
    - ["클라우드 워크숍", 2, "2025-04-12"]
    - ["알고리즘 캠프", 4, "2025-04-29"]
    - ["해커톤", 2, "2025-06-07"]
    - ["오픈소스 기여 행사", 2, "2025-08-24"]
  orderMatters: true
hint: "DATEDIFF(끝, 시작) + 1, DATE_SUB(날짜, INTERVAL n DAY)"
# 정답 예시 — 화면엔 안 나오고 오늘의 문제 풀이와 검증 테스트에 쓴다.
solution: |
  SELECT title,
         DATEDIFF(end_date, start_date) + 1 AS days,
         DATE_SUB(start_date, INTERVAL 7 DAY) AS early_deadline
  FROM events
  WHERE end_date <> start_date
  ORDER BY id
