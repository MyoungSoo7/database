id: "func-003"
title: "REPLACE · LEFT · RIGHT — 전화번호 가운데 가리기"
category: "func"
difficulty: 2
description: |
  `members` 의 전화번호(`phone`, 예: `'010-1234-5678'`)를 *하이픈 없이* 쓰고 가운데 4자리를 `*` 로 가린 `masked_phone` 을 만드세요.
  예: `'010-1234-5678'` → `'010****5678'`

  결과 컬럼은 `name`, `masked_phone` 두 개이고 `id` 오름차순입니다. *정렬 순서가 채점 대상* 입니다.
type: SELECT
schema: "schema.sql"
expected:
  columns: ["name", "masked_phone"]
  rows:
    - ["김철수", "010****5678"]
    - ["이영희", "010****6789"]
    - ["박민", "010****7890"]
    - ["남궁민수", "010****8901"]
    - ["Tom", "010****9012"]
    - ["최지훈", "010****0123"]
    - ["정수연", "010****1234"]
    - ["황보", "010****2345"]
    - ["제갈공명", "010****3456"]
    - ["Alice", "010****2222"]
    - ["윤하늘", "010****4444"]
    - ["서지아", "010****6666"]
  orderMatters: true
hint: "REPLACE 로 하이픈을 없앤 뒤 앞 3자리와 뒤 4자리를 잘라 CONCAT"
# 정답 예시 — 화면엔 안 나오고 오늘의 문제 풀이와 검증 테스트에 쓴다.
solution: |
  SELECT name,
         CONCAT(LEFT(REPLACE(phone, '-', ''), 3), '****', RIGHT(REPLACE(phone, '-', ''), 4)) AS masked_phone
  FROM members
  ORDER BY id
