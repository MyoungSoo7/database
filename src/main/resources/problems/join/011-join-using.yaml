id: "join-011"
title: "서울 근무 직원 — JOIN ... USING"
category: "join"
difficulty: 1
description: |
  `staff` 와 `departments` 는 같은 이름의 컬럼 `dept_id` 로 연결됩니다.
  근무지(`departments.location`)가 `'서울'` 인 부서에 속한 직원의 이름과 부서 이름을 조회하세요. 부서가 없는 직원은 제외합니다.

  결과 컬럼은 `name`, `dept_name` 두 개입니다. 정렬은 채점하지 않습니다.

  연결 컬럼 이름이 양쪽에서 같으면 `ON a.x = b.x` 대신 `USING (x)` 로 줄여 쓸 수 있습니다.
type: SELECT
schema: "schema.sql"
expected:
  columns: ["name", "dept_name"]
  rows:
    - ["한대표", "개발팀"]
    - ["오개발", "개발팀"]
    - ["신코딩", "개발팀"]
    - ["배인사", "인사팀"]
    - ["조신입", "개발팀"]
  orderMatters: false
hint: "FROM staff JOIN departments USING (dept_id)"
# 정답 예시 — 화면엔 안 나오고 오늘의 문제 풀이와 검증 테스트에 쓴다.
solution: |
  SELECT s.name,
         d.dept_name
  FROM staff s
  JOIN departments d USING (dept_id)
  WHERE d.location = '서울'
