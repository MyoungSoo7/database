id: "join-007"
title: "결제 완료 주문 수, 0건 고객 포함 — LEFT JOIN 의 ON 과 WHERE"
category: "join"
difficulty: 2
description: |
  **모든 고객**에 대해 결제 완료(`status = 'PAID'`) 주문 건수를 구하세요.
  결제 완료 주문이 없는 고객도 빠지지 않고 `0` 으로 나와야 합니다.

  결과 컬럼은 `name`(고객 이름), `paid_count` 두 개입니다. 정렬은 채점하지 않습니다.

  함정: LEFT JOIN 뒤 `WHERE p.status = 'PAID'` 로 거르면, 짝이 없어 `p.status` 가 NULL 인 고객 행까지 사라져
  LEFT JOIN 이 INNER JOIN 처럼 동작합니다. 오른쪽 테이블에 대한 조건을 어디에 두어야 할까요?
type: SELECT
schema: "schema.sql"
expected:
  columns: ["name", "paid_count"]
  rows:
    - ["김민준", 3]
    - ["이서연", 2]
    - ["박도윤", 1]
    - ["최지우", 0]
    - ["정하준", 1]
    - ["강서아", 0]
  orderMatters: false
hint: "오른쪽 테이블 조건은 ON 절에 넣고, 개수는 COUNT(*) 가 아니라 COUNT(p.id)."
# 정답 예시 — 화면엔 안 나오고 오늘의 문제 풀이와 검증 테스트에 쓴다.
solution: |
  SELECT c.name,
         COUNT(p.id) AS paid_count
  FROM customers c
  LEFT JOIN purchases p
         ON p.customer_id = c.id
        AND p.status = 'PAID'
  GROUP BY c.id, c.name
